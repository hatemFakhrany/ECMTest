<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ECM+</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #faf9f8;
      color: #201f1e;
    }
    h1 {
      font-size: 18px;
      color: #0078d4;
    }
    #status {
      margin-top: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #edebe9;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      background: #0078d4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #106ebe;
    }
    input {
      display: block;
      width: 100%;
      max-width: 260px;
      padding: 6px 8px;
      margin-top: 6px;
      border: 1px solid #c8c6c4;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      display: block;
    }
    #loginError {
      color: #a4262c;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    #loginSection, #appSection {
      margin-top: 10px;
    }
    #appSection {
      display: none;
    }
    #userBadge {
      font-size: 13px;
      color: #605e5c;
      margin-bottom: 8px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #edebe9;
      margin: 16px 0;
    }
    .tab-button {
      margin-top: 0;
      background: transparent;
      color: #605e5c;
      border-bottom: 3px solid transparent;
      border-radius: 0;
    }
    .tab-button.active {
      color: #0078d4;
      border-bottom-color: #0078d4;
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(32, 31, 30, 0.45);
      z-index: 10;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal {
      width: min(70vw, 720px);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }
    .modal-header, .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #edebe9;
    }
    .modal-footer {
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #edebe9;
      border-bottom: 0;
    }
    .modal-body {
      padding: 18px;
    }
    .modal-close {
      margin: 0;
      padding: 2px 8px;
      background: transparent;
      color: #605e5c;
      font-size: 20px;
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field-grid label {
      margin-top: 0;
    }
    .field-grid input, .field-grid select, .field-grid textarea {
      width: 100%;
      max-width: none;
      box-sizing: border-box;
    }
    .field-grid textarea {
      min-height: 72px;
      resize: vertical;
    }
    .modal-card {
      margin-top: 14px;
      border: 1px solid #edebe9;
      border-radius: 4px;
    }
    .modal-card-header {
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-card-body {
      padding: 12px;
    }
    .message {
      margin: 12px 0 0;
      padding: 10px;
      border-radius: 4px;
    }
    .message.success { background: #dff6dd; color: #107c10; }
    .message.error { background: #fde7e9; color: #a4262c; }
    @media (max-width: 560px) {
      .field-grid { grid-template-columns: 1fr; }
      .modal { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>ECM+</h1>

  <!-- ==== LOGIN SECTION (shown first) ==== -->
  <div id="loginSection">
    <p>Sign in to use ECM+.</p>
    <label for="username">User Name</label>
    <input type="text" id="username" autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button id="loginBtn">Login</button>
    <div id="loginError"></div>
  </div>

  <!-- ==== MAIN APP SECTION (hidden until login succeeds) ==== -->
  <div id="appSection">
    <div id="userBadge"></div>
    <button id="logoutBtn" style="background:#a4262c; font-size:12px; padding:4px 10px; margin-top:0;">Logout</button>
    <div class="tabs" role="tablist" aria-label="ECM sections">
      <button class="tab-button active" id="archiveTab" role="tab" aria-selected="true" aria-controls="archivePanel">Archive</button>
      <button class="tab-button" id="correspondenceTab" role="tab" aria-selected="false" aria-controls="correspondencePanel">Convert to correspondence</button>
    </div>

    <section class="tab-panel active" id="archivePanel" role="tabpanel" aria-labelledby="archiveTab">
      <button id="saveBtn">Create new document</button>
      <button id="getInfoBtn" style="margin-left:8px;">Show email details</button>
      <div id="status"></div>
      <h3>Attachments</h3>
      <div id="attachmentsList">No attachments loaded yet.</div>
    </section>

    <section class="tab-panel" id="correspondencePanel" role="tabpanel" aria-labelledby="correspondenceTab">
      <p>Convert the selected email to a correspondence record.</p>
      <button id="btnCorr">Convert to correspondence</button>
    </section>
  </div>

  <div class="modal-backdrop" id="createNewDocumentModal" role="dialog" aria-modal="true" aria-labelledby="createNewDocumentTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="createNewDocumentTitle">Create new document</h2>
        <button type="button" class="modal-close" id="closeCreateDocument" aria-label="Close">&times;</button>
      </div>
      <form id="createNewDocumentForm">
        <div class="modal-body">
          <div class="field-grid" id="basicDocumentFields"></div>
          <div class="modal-card">
            <div class="modal-card-header" id="extraInfoToggle" tabindex="0" role="button" aria-expanded="true">Extra info</div>
            <div class="modal-card-body" id="extraDocumentFields"></div>
          </div>
          <div class="modal-card" id="customAttributesCard" hidden>
            <div class="modal-card-header" id="customAttributesToggle" tabindex="0" role="button" aria-expanded="false">Custom attributes</div>
            <div class="modal-card-body" id="customDocumentFields" hidden></div>
          </div>
          <div class="message success" id="successMessage" hidden></div>
          <div class="message error" id="failedMessage" hidden></div>
          <div id="generatedHiddensContainer"></div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="btnSaveNewDocument">Save</button>
          <button type="button" id="cancelCreateDocument" style="background:#605e5c;">Close</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ==== CONFIGURE THIS ====
    const API_ENDPOINT = "https://ileana-nonsculptural-ludie.ngrok-free.dev/api/Outlook/";
    // The API should return an array of field definitions grouped by behaviour.
    const DOCUMENT_FIELDS_ENDPOINT = API_ENDPOINT + "GetDocumentMetadata";
    // ASSUMPTION: adjust this path if your AuthenticateActiveDirectory action lives under a
    // different controller route.
    const LOGIN_ENDPOINT = "https://ileana-nonsculptural-ludie.ngrok-free.dev/api/Authentication/Authenticate";
    // =========================

    // Holds the logged-in user's info once login succeeds; attached to every later request.
    let currentUser = null; // will become { userId, userName }

    // Read which action this task pane instance was opened for (from the ribbon menu).
    // mode is "archive", "convert", or null (opened directly / for manual testing).
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get("mode");

    Office.onReady(() => {
      const item = Office.context.mailbox.item;

      // If opened from the Archive / Convert To Correspondence menu items, hide the manual
      // buttons and status header text -- we'll drive the flow automatically instead.
      if (mode === "archive" || mode === "convert") {
        document.getElementById("getInfoBtn").style.display = "none";
        document.getElementById("saveBtn").style.display = "none";
        document.getElementById("btnCorr").style.display = "none";
      }

      function selectTab(tabId, panelId) {
        document.querySelectorAll(".tab-button").forEach((tab) => {
          const selected = tab.id === tabId;
          tab.classList.toggle("active", selected);
          tab.setAttribute("aria-selected", selected ? "true" : "false");
        });
        document.querySelectorAll(".tab-panel").forEach((panel) => {
          panel.classList.toggle("active", panel.id === panelId);
        });
      }

      document.getElementById("archiveTab").onclick = () => selectTab("archiveTab", "archivePanel");
      document.getElementById("correspondenceTab").onclick = () => selectTab("correspondenceTab", "correspondencePanel");

      function closeDocumentModal() {
        document.getElementById("createNewDocumentModal").classList.remove("open");
      }

      function toggleCard(toggleId, bodyId) {
        const toggle = document.getElementById(toggleId);
        const body = document.getElementById(bodyId);
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", expanded ? "false" : "true");
        body.hidden = expanded;
      }

      document.getElementById("closeCreateDocument").onclick = closeDocumentModal;
      document.getElementById("cancelCreateDocument").onclick = closeDocumentModal;
      document.getElementById("extraInfoToggle").onclick = () => toggleCard("extraInfoToggle", "extraDocumentFields");
      document.getElementById("customAttributesToggle").onclick = () => toggleCard("customAttributesToggle", "customDocumentFields");

      function fieldValue(field) {
        return field.defaultValue ?? field.value ?? "";
      }

      function renderField(field, container) {
        const wrapper = document.createElement("div");
        const label = document.createElement("label");
        const fieldId = field.id || field.name || "documentField";
        label.htmlFor = fieldId;
        label.innerText = field.label || field.title || field.name || fieldId;
        wrapper.appendChild(label);

        let control;
        if (String(field.type || "text").toLowerCase() === "textarea") {
          control = document.createElement("textarea");
        } else if (String(field.type || "text").toLowerCase() === "select" || Array.isArray(field.options)) {
          control = document.createElement("select");
          (field.options || []).forEach((option) => {
            const optionElement = document.createElement("option");
            optionElement.value = option.value ?? option.id ?? option;
            optionElement.innerText = option.label ?? option.name ?? option;
            control.appendChild(optionElement);
          });
        } else {
          control = document.createElement("input");
          control.type = field.type || "text";
        }
        control.id = fieldId;
        control.name = field.name || fieldId;
        control.value = fieldValue(field);
        control.required = Boolean(field.required);
        wrapper.appendChild(control);
        container.appendChild(wrapper);
      }

      function renderDocumentFields(definitions) {
        const basicFields = document.getElementById("basicDocumentFields");
        const extraFields = document.getElementById("extraDocumentFields");
        const customFields = document.getElementById("customDocumentFields");
        basicFields.innerHTML = "";
        extraFields.innerHTML = "";
        customFields.innerHTML = "";

        const fields = Array.isArray(definitions) ? definitions : (definitions.fields || []);
        fields.forEach((field) => {
          const behaviour = String(field.behaviour || field.section || "basic").toLowerCase();
          renderField(field, behaviour.includes("custom") ? customFields : behaviour.includes("extra") ? extraFields : basicFields);
        });

        const hasCustomFields = customFields.children.length > 0;
        document.getElementById("customAttributesCard").hidden = !hasCustomFields;
        if (!hasCustomFields) customFields.hidden = true;
      }

      async function loadDocumentFields() {
        const basicFields = document.getElementById("basicDocumentFields");
        basicFields.innerText = "Loading document fields...";
        try {
          const query = currentUser ? "?userId=" + encodeURIComponent(currentUser.userId) : "";
          const response = await fetch(DOCUMENT_FIELDS_ENDPOINT + query, { headers: { "Accept": "application/json" } });
          if (!response.ok) throw new Error("Field request failed (" + response.status + ")");
          renderDocumentFields(await response.json());
        } catch (error) {
          basicFields.innerText = "Unable to load document fields: " + error.message;
        }
      }

      function collectDocumentFields() {
        const values = {};
        document.querySelectorAll("#createNewDocumentForm [name]").forEach((control) => {
          values[control.name] = control.value;
        });
        return values;
      }

      document.getElementById("saveBtn").onclick = () => {
        document.getElementById("createNewDocumentModal").classList.add("open");
        document.getElementById("successMessage").hidden = true;
        document.getElementById("failedMessage").hidden = true;
        loadDocumentFields();
      };

      document.getElementById("createNewDocumentForm").onsubmit = (event) => {
        event.preventDefault();
        const saveButton = document.getElementById("btnSaveNewDocument");
        saveButton.disabled = true;
        document.getElementById("successMessage").hidden = true;
        document.getElementById("failedMessage").hidden = true;
        collectEmailData((data) => {
          saveToDatabase({ ...data, documentFields: collectDocumentFields() }, {
            onSuccess: (message) => {
              const success = document.getElementById("successMessage");
              success.innerText = message;
              success.hidden = false;
              saveButton.disabled = false;
            },
            onError: (message) => {
              const failed = document.getElementById("failedMessage");
              failed.innerText = message;
              failed.hidden = false;
              saveButton.disabled = false;
            }
          });
        });
      };

      // Runs the correct action automatically once the person is logged in.
      function runAutoAction() {
        if (mode !== "archive" && mode !== "convert") return;
        document.getElementById("status").innerText = "Collecting email data...";
        collectEmailData((data) => {
          document.getElementById("status").innerText = "Uploading to ECM+...";
          if (mode === "archive") {
            saveToDatabase(data);
          } else {
            ConvertToCorr(data);
          }
        });
      }

      // ---- Try to restore a cached login first, so the person isn't asked to sign in
      // every time they open the task pane (e.g. on a new email). ----
      const cachedUser = Office.context.roamingSettings.get("ecmCurrentUser");
      if (cachedUser) {
        currentUser = cachedUser;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        document.getElementById("userBadge").innerText =
          "Welcome " + (currentUser.fullName || currentUser.userName);
        runAutoAction();
      }

      // ---- LOGOUT ----
      document.getElementById("logoutBtn").onclick = () => {
        currentUser = null;
        Office.context.roamingSettings.remove("ecmCurrentUser");
        Office.context.roamingSettings.saveAsync();
        document.getElementById("appSection").style.display = "none";
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      };

      // ---- LOGIN ----
      document.getElementById("loginBtn").onclick = () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("loginError");
        errorDiv.style.display = "none";

        if (!username || !password) {
          errorDiv.innerText = "Please enter both username and password.";
          errorDiv.style.display = "block";
          return;
        }

        document.getElementById("loginBtn").disabled = true;
        document.getElementById("loginBtn").innerText = "Signing in...";

        fetch(LOGIN_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // ASSUMPTION: AuthenticateUserQuery's field names. If your query uses different
          // property names, change "userName"/"password" below to match exactly.
          body: JSON.stringify({
            userName: username,
            password: password
          })
        })
          .then(async (response) => {
            if (!response.ok) {
              const text = await response.text().catch(() => "");
              throw new Error("Login request failed (" + response.status + ") " + text);
            }
            return response.json();
          })
          .then((result) => {
            // AuthenticateUserResult = { status, user, valid }.
            // valid is true only when status === Authenticated AND user is not null.
            if (!result.valid || !result.user) {
              throw new Error(
                "Login failed" + (result.status ? " (" + result.status + ")" : "") +
                ". Check your username and password."
              );
            }

            currentUser = {
              userId: result.user.id,
              userName: result.user.userName,
              fullName: result.user.fullName
            };

            // Cache the login so re-opening the task pane (e.g. on a different email)
            // doesn't ask the person to sign in again.
            Office.context.roamingSettings.set("ecmCurrentUser", currentUser);
            Office.context.roamingSettings.saveAsync();

            document.getElementById("loginSection").style.display = "none";
            document.getElementById("appSection").style.display = "block";
            document.getElementById("userBadge").innerText =
              "Signed in as " + (currentUser.fullName || currentUser.userName) +
              " (ID: " + currentUser.userId + ")";
            runAutoAction();
          })
          .catch((err) => {
            errorDiv.innerText = err.message;
            errorDiv.style.display = "block";
          })
          .finally(() => {
            document.getElementById("loginBtn").disabled = false;
            document.getElementById("loginBtn").innerText = "Login";
          });
      };

      // ---- APP BUTTONS (only usable after login) ----
      document.getElementById("getInfoBtn").onclick = () => {
        if (!item) {
          document.getElementById("status").innerText = "No item selected.";
          return;
        }
        collectEmailData((data) => {
          document.getElementById("status").innerHTML =
            "<b>Subject:</b> " + data.subject + "<br><br>" +
            "<b>From:</b> " + data.from + "<br><br>" +
            "<b>To:</b> " + data.to + "<br><br>" +
            "<b>Body:</b><br>" + data.body.replace(/\n/g, "<br>") + "<br><br>" +
            "<b>Attachments:</b> " + data.attachments.length;
        });
      };

      document.getElementById("btnCorr").onclick = () => {
        document.getElementById("status").innerText = "Collecting email data...";
        collectEmailData((data) => {
          document.getElementById("status").innerText = "Uploading to ECM+...";
          ConvertToCorr(data);
        });
      };

      // ---- Collect subject, from, to, body, and attachment contents ----
      function collectEmailData(callback) {
        const subject = item.subject || "";
        const from = item.from ? item.from.emailAddress : "";
        const to = (item.to || []).map(r => r.emailAddress).join(";");
        const cc = (item.cc || []).map(r => r.emailAddress).join(";");

        item.body.getAsync(Office.CoercionType.Text, (bodyResult) => {
          const body = bodyResult.status === Office.AsyncResultStatus.Succeeded
            ? bodyResult.value
            : "";

          const attachmentDefs = (item.attachments || []).filter(a => !a.isInline);

          if (attachmentDefs.length === 0) {
            callback(buildPayload({ subject, from, to, cc, body, attachments: [] }));
            return;
          }

          let remaining = attachmentDefs.length;
          const attachments = [];

          attachmentDefs.forEach((att) => {
            item.getAttachmentContentAsync(att.id, (result) => {
              if (result.status === Office.AsyncResultStatus.Succeeded &&
                  result.value.format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                attachments.push({
                  name: att.name,
                  contentType: att.contentType || "application/octet-stream",
                  sizeBytes: att.size,
                  contentBase64: result.value.content
                });
              }
              remaining--;
              if (remaining === 0) {
                callback(buildPayload({ subject, from, to, cc, body, attachments }));
              }
            });
          });
        });
      }

      // Attaches the logged-in user's id/name to every outgoing payload.
      function buildPayload(emailData) {
        return {
          ...emailData,
          userId: currentUser ? currentUser.userId : null,
          userName: currentUser ? currentUser.userName : null
        };
      }

      // ---- POST the collected data to your API ----
      function saveToDatabase(data, callbacks) {
        var x = API_ENDPOINT + 'CreateDocumnet';

        fetch(x, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        })
          .then(async response => {
            const text = await response.text();
            if (!response.ok) throw new Error("Document request failed (" + response.status + ") " + text);
            if (callbacks && callbacks.onSuccess) callbacks.onSuccess("Document created successfully.");
            else document.getElementById("status").innerText = "Sent Successfully to ECM+ ";
          })
          .catch(err => {
            console.error(err);
            if (callbacks && callbacks.onError) callbacks.onError(err.message);
            else document.getElementById("status").innerText = "Network Error: " + err.message;
          });
      }

      function ConvertToCorr(data) {
        var x = API_ENDPOINT + 'CreateCorrespondence';
        fetch(x, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        })
          .then(async response => {
            const text = await response.text();
            document.getElementById("status").innerText =
              "Status: " + response.status + " Response: " + text;
          })
          .catch(err => {
            console.error(err);
            document.getElementById("status").innerText = "Network Error: " + err.message;
          });
      }

      // ---- Render the attachment list (unchanged, for manual download) ----
      const listDiv = document.getElementById("attachmentsList");
      if (item && item.attachments && item.attachments.length > 0) {
        listDiv.innerHTML = "";
        item.attachments.forEach((att) => {
          const row = document.createElement("div");
          row.style.marginBottom = "8px";

          const label = document.createElement("span");
          label.innerText = att.name + " (" + Math.round(att.size / 1024) + " KB) ";
          row.appendChild(label);

          if (!att.isInline) {
            const btn = document.createElement("button");
            btn.innerText = "Download";
            btn.onclick = () => downloadAttachment(att);
            row.appendChild(btn);
          }

          listDiv.appendChild(row);
        });
      } else {
        listDiv.innerText = "No attachments on this item.";
      }

      function downloadAttachment(att) {
        item.getAttachmentContentAsync(att.id, (result) => {
          if (result.status !== Office.AsyncResultStatus.Succeeded) {
            alert("Failed to fetch attachment: " + result.error.message);
            return;
          }
          const content = result.value;
          if (content.format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
            const byteChars = atob(content.content);
            const byteNumbers = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
              byteNumbers[i] = byteChars.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray]);
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = att.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          } else if (content.format === Office.MailboxEnums.AttachmentContentFormat.Url) {
            window.open(content.content, "_blank");
          } else {
            alert("Unsupported attachment format: " + content.format);
          }
        });
      }
    });
  </script>
</body>
</html>
