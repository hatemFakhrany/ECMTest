<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ECM+</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #faf9f8;
      color: #201f1e;
    }
    h1 {
      font-size: 18px;
      color: #0078d4;
    }
    #status {
      margin-top: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #edebe9;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      background: #0078d4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #106ebe;
    }
  </style>
</head>
<body>
  <h1>ECM</h1>
  <p>This task pane For Save EMail in ECM+.</p>
  <button id="getInfoBtn">Show email details</button>
  <button id="saveBtn" style="margin-left:8px;">Create new Document</button>
   <button id="btnCorr" style="margin-left:8px;">Convert to correspondence</button>
  <div id="status">Waiting for action...</div>

  <h3>Attachments</h3>
  <div id="attachmentsList">No attachments loaded yet.</div>

  <script>
    // ==== CONFIGURE THIS ====
    const API_ENDPOINT = "https://ileana-nonsculptural-ludie.ngrok-free.dev/api/Emails/"; // NOTE: HTTP endpoint - see warning below
    // =========================

    Office.onReady(() => {
      const item = Office.context.mailbox.item;

      document.getElementById("getInfoBtn").onclick = () => {
        if (!item) {
          document.getElementById("status").innerText = "No item selected.";
          return;
        }
        collectEmailData((data) => {
          document.getElementById("status").innerHTML =
            "<b>Subject:</b> " + data.subject + "<br><br>" +
            "<b>From:</b> " + data.from + "<br><br>" +
            "<b>To:</b> " + data.to + "<br><br>" +
            "<b>Body:</b><br>" + data.body.replace(/\n/g, "<br>") + "<br><br>" +
            "<b>Attachments:</b> " + data.attachments.length;
        });
      };

      document.getElementById("saveBtn").onclick = () => {
        document.getElementById("status").innerText = "Collecting email data...";
        collectEmailData((data) => {
          document.getElementById("status").innerText = "Uploading to database...";
          saveToDatabase(data);
        });
      };
     document.getElementById("btnCorr").onclick = () => {
        document.getElementById("status").innerText = "Collecting email data...";
        collectEmailData((data) => {
          document.getElementById("status").innerText = "Uploading to database...";
          ConvertToCorr(data);
        });
      };
      // ---- Collect subject, from, to, body, and attachment contents ----
      function collectEmailData(callback) {
        const subject = item.subject || "";
        const from = item.from ? item.from.emailAddress : "";
        const to = (item.to || []).map(r => r.emailAddress).join(";");

        item.body.getAsync(Office.CoercionType.Text, (bodyResult) => {
          const body = bodyResult.status === Office.AsyncResultStatus.Succeeded
            ? bodyResult.value
            : "";

          const attachmentDefs = (item.attachments || []).filter(a => !a.isInline);

          if (attachmentDefs.length === 0) {
            callback({ subject, from, to, body, attachments: [] });
            return;
          }

          // Fetch content for every attachment in parallel
          let remaining = attachmentDefs.length;
          const attachments = [];

          attachmentDefs.forEach((att) => {
            item.getAttachmentContentAsync(att.id, (result) => {
              if (result.status === Office.AsyncResultStatus.Succeeded &&
                  result.value.format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                attachments.push({
                  name: att.name,
                  contentType: att.contentType || "application/octet-stream",
                  sizeBytes: att.size,
                  contentBase64: result.value.content
                });
              }
              remaining--;
              if (remaining === 0) {
                callback({ subject, from, to, body, attachments });
              }
            });
          });
        });
      }

      // ---- POST the collected data to your API ----
      function saveToDatabase(data) {
	 var x= API_ENDPOINT+'CreateDocumnet';
	 alert(x);
        fetch(x, {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
})
.then(async response => {

    const text = await response.text();

    document.getElementById("status").innerText =
        "Status: " + response.status +
        " Response: " + text;
})
.catch(err => {

    console.error(err);

    document.getElementById("status").innerText =
        "Network Error: " + err.message;
});
      }
function ConvertToCorr(data) {
var x= API_ENDPOINT+'CreateCorrespondence';
alert(x);
        fetch(x, {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
})
.then(async response => {

    const text = await response.text();

    document.getElementById("status").innerText =
        "Status: " + response.status +
        " Response: " + text;
})
.catch(err => {

    console.error(err);

    document.getElementById("status").innerText =
        "Network Error: " + err.message;
});
      }
      // ---- Render the attachment list (unchanged from before, for manual download) ----
      const listDiv = document.getElementById("attachmentsList");
      if (item && item.attachments && item.attachments.length > 0) {
        listDiv.innerHTML = "";
        item.attachments.forEach((att) => {
          const row = document.createElement("div");
          row.style.marginBottom = "8px";

          const label = document.createElement("span");
          label.innerText = att.name + " (" + Math.round(att.size / 1024) + " KB) ";
          row.appendChild(label);

          if (!att.isInline) {
            const btn = document.createElement("button");
            btn.innerText = "Download";
            btn.onclick = () => downloadAttachment(att);
            row.appendChild(btn);
          }

          listDiv.appendChild(row);
        });
      } else {
        listDiv.innerText = "No attachments on this item.";
      }

      function downloadAttachment(att) {
        item.getAttachmentContentAsync(att.id, (result) => {
          if (result.status !== Office.AsyncResultStatus.Succeeded) {
            alert("Failed to fetch attachment: " + result.error.message);
            return;
          }
          const content = result.value;
          if (content.format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
            const byteChars = atob(content.content);
            const byteNumbers = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
              byteNumbers[i] = byteChars.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray]);
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = att.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          } else if (content.format === Office.MailboxEnums.AttachmentContentFormat.Url) {
            window.open(content.content, "_blank");
          } else {
            alert("Unsupported attachment format: " + content.format);
          }
        });
      }
    });
  </script>
</body>
</html>
